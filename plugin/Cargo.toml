[package]
name = "tauri-plugin-krizaka"
version = "0.3.0"
description = "The Tauri side of krizaka-tauri-kit: folder grants, dropped files, watched folders, the Keychain session, the native menu, deep links and the navigation guard of a Krizaka Mac app"
authors = ["Krizaka"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/krizaka/krizaka-tauri-kit"
links = "tauri-plugin-krizaka"

[dependencies]
krizaka-tauri-kit = { path = "..", features = ["keychain"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
url = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
