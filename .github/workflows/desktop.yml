# The Mac app (.): the org's reusable Tauri pipeline (krizaka/.github tauri-macos.yml, ADR-005). The checks run on
# every pull request that touches the app or the contracts it reads; a `desktop-v*` tag builds the arm64 .dmg and attaches it
# to the release (signed and notarised once the Apple secrets exist).
name: Desktop

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    permissions:
      contents: write
    uses: krizaka/.github/.github/workflows/tauri-macos.yml@eebba5e6e80145b0892af1742b5c09aa3d1560eb # main
    with:
      working-directory: .
      product-name: __Name__
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
