# The Mac app (.): the org's reusable Tauri pipeline (krizaka/.github tauri-macos.yml, ADR-005). The checks run on
# every pull request that touches the app or the contracts it reads; a `desktop-v*` tag builds the arm64 .dmg and attaches it
# to the release (signed and notarised once the Apple secrets exist).
name: Desktop

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    permissions:
      contents: write
    uses: krizaka/.github/.github/workflows/tauri-macos.yml@8a90a66bec6c227af139b39c6c33ba58b400b59a # main
    with:
      working-directory: .
      product-name: __Name__
    # Signing secrets only on a tag (push): the pipeline refuses a secret on a pull request (sign: false).
    secrets:
      APPLE_CERTIFICATE: ${{ github.event_name == 'push' && secrets.APPLE_CERTIFICATE || '' }}
      APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_API_ISSUER: ${{ github.event_name == 'push' && secrets.APPLE_API_ISSUER || '' }}
      APPLE_API_KEY: ${{ github.event_name == 'push' && secrets.APPLE_API_KEY || '' }}
      APPLE_API_KEY_P8: ${{ github.event_name == 'push' && secrets.APPLE_API_KEY_P8 || '' }}
      APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
