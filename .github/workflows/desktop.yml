# The Mac app (.): the org's reusable Tauri pipeline (krizaka/.github tauri-macos.yml, ADR-005). The checks run on
# every pull request that touches the app or the contracts it reads; a `desktop-v*` tag builds the arm64 .dmg and attaches it
# to the release (signed and notarised once the Apple secrets exist).
name: Desktop

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-pr:
    # pull_request: unsigned, no secret passed (the shared workflow refuses one in this mode)
    if: github.event_name == 'pull_request'
    uses: krizaka/.github/.github/workflows/tauri-macos.yml@3f78a2d25b154a21cabbc5d57b8278f6b1ddf0f1 # main
    with:
      working-directory: .
      product-name: __Name__
      sign: false

  desktop-release:
    # push of a desktop-v* tag: signed and notarised in the `release` environment, secrets passed by name
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: krizaka/.github/.github/workflows/tauri-macos.yml@3f78a2d25b154a21cabbc5d57b8278f6b1ddf0f1 # main
    with:
      working-directory: .
      product-name: __Name__
      sign: true
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
