# The kit's checks (reusable so the required check is `ci / CI gate`, like every Krizaka repository).
name: rust

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The plugin's permissions are generated by its build: what is committed is what the build writes.
      - run: git diff --exit-code -- plugin/permissions

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: The checks passed
        env:
          RESULT: ${{ needs.rust.result }}
        run: '[ "$RESULT" = success ]'
