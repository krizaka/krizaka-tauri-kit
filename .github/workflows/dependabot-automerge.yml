# Dependabot auto-merge: patch and minor (grouped included) merge when the required checks pass; majors stay manual.
# Logic lives in krizaka/.github (reusable); this file only hands over the event. It does not check out or run the PR's code.
# Scorecard (Token-Permissions): the token is read-only at the top; the write scopes sit on the job that needs them.
# Pin the reusable workflow by commit SHA once copied: `node scripts/pin-supply-chain.mjs` (and `--refresh` to move it).
name: Dependabot auto-merge

on: pull_request_target # zizmor: ignore[dangerous-triggers] checks out nothing and runs no PR code; hands the event to the pinned reusable workflow
permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: krizaka/.github/.github/workflows/dependabot-automerge.yml@ea12aa78187da74ed63387383885c85606bf4051 # main
