# Dependabot: the Krizaka model (weekly, grouped; krizaka/.github#332). Every Monday (06:00 Paris): one pull request per
# ecosystem for minor and patch (`minor-patch`); a major is its own pull request, never grouped. Security fixes stay on and
# arrive grouped apart. Auto-merge is the shared dependabot-automerge.yml: minor and patch only, once CI is green.
version: 2
updates:

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    labels: ["area:deps"]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
