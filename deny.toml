# The Krizaka cargo-deny baseline (krizaka/.github docs/standards/lang/deny.toml) plus this repository's recorded advisories.
# An ignore is debt with a reason and an exit: it goes when the upstream crate is bumped, never to get green.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; pulled by zbus 5 through keyring and tauri, goes with their bump" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; pulled by zbus 5 through keyring and tauri, goes with their bump" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; pulled by zbus 5 through keyring and tauri, goes with their bump" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0", "OpenSSL"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
