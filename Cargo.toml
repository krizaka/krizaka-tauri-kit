[package]
name = "krizaka-tauri-kit"
version = "0.1.0"
description = "What every Krizaka macOS app shares: folder grants checked on canonical paths, file listing and preview inside a grant, and the navigation guard"
authors = ["Krizaka"]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
repository = "https://github.com/krizaka/krizaka-tauri-kit"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
url = "2"

[dev-dependencies]
tempfile = "3"
